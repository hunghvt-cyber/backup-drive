name: Two-Way Sync (Google Drive <-> Koofr)

on:
  schedule:
    # 02:00 Vietnam = 19:00 UTC
    - cron: '0 19 * * *'

  workflow_dispatch:
    inputs:
      resync:
        description: 'Rebuild bisync baseline. Chỉ bật lần đầu hoặc khi rclone yêu cầu.'
        required: false
        type: boolean
        default: false
      reset:
        description: 'Xóa bisync state + ignore list cũ và chạy lại sạch như lần đầu.'
        required: false
        type: boolean
        default: false

concurrency:
  group: gdrive-koofr-bisync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bisync:
    runs-on: ubuntu-latest
    # GitHub-hosted runner có giới hạn cứng 360 phút/job (6 giờ),
    # không thể vượt qua dù đặt cao hơn. Đặt sát mức này để tận
    # dụng tối đa thời gian cho lần resync đầu tiên (~92GB).
    timeout-minutes: 330

    steps:

      # ============================================================
      # 1. Install rclone
      # ============================================================
      - name: Install Rclone
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://rclone.org/install.sh | sudo bash

          echo "Rclone version:"
          rclone version


      # ============================================================
      # 2. Checkout repository
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 3. Configure rclone
      # ============================================================
      - name: Configure Rclone
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_CONTENT" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          echo "Available remotes:"
          rclone listremotes

          echo ""
          echo "Testing Google Drive..."
          rclone lsd gdrive: --max-depth 1

          echo ""
          echo "Testing Koofr..."
          # Retry only the read-only connectivity check for temporary service errors.
          for attempt in 1 2 3; do
            if rclone lsd koofr:GoogleBackup --max-depth 1; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done


      # ============================================================
      # 4. Restore bisync state
      # ============================================================
      - name: Restore Bisync State
        if: ${{ inputs.reset != true }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rclone/bisync
          key: rclone-bisync-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            rclone-bisync-state-${{ github.ref_name }}-
            rclone-bisync-state-


      # ============================================================
      # 5. Restore ignored files
      # ============================================================
      - name: Restore Ignored Files
        id: ignored_cache
        if: ${{ inputs.reset != true }}
        uses: actions/cache/restore@v4
        with:
          path: .sync-state
          key: rclone-ignored-files-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            rclone-ignored-files-${{ github.ref_name }}-
            rclone-ignored-files-


      # Run #62 failed before restoring state but cached an empty ignore list.
      # Recover the last known populated cache only when that exact bad key wins.
      - name: Recover Ignore Cache After Configuration Failure
        if: ${{ inputs.reset != true && steps.ignored_cache.outputs.cache-matched-key == 'rclone-ignored-files-main-37156780658' }}
        uses: actions/cache/restore@v4
        with:
          path: .sync-state
          key: rclone-ignored-files-main-37074336340
          fail-on-cache-miss: true

      # ============================================================
      # 6. Prepare state
      # ============================================================
      - name: Prepare State
        id: state
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.reset }}" = "true" ]; then
            echo "[MODE] CLEAN RESET"
            rm -rf "$HOME/.cache/rclone/bisync" .sync-state
          fi

          # Share one time budget across the initial run and an optional retry.
          # Give rclone at most 5 hours. The job keeps a separate 30-minute
          # reserve for parsing, cache/state save, artifact upload and summary.
          echo "BISYNC_DEADLINE=$(( $(date +%s) + 300 * 60 ))" >> "$GITHUB_ENV"

          mkdir -p .sync-state
          touch .sync-state/ignored-files.txt

          sort -u .sync-state/ignored-files.txt \
            -o .sync-state/ignored-files.txt

          if [ ! -f .sync-state/resync-pending ] && \
             [ -d "$HOME/.cache/rclone/bisync" ] && \
             find "$HOME/.cache/rclone/bisync" \
             -type f -print -quit | grep -q .; then

            echo "state_exists=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] Existing bisync state found."

          else

            echo "state_exists=false" >> "$GITHUB_OUTPUT"
            echo "[INFO] No bisync state found."

          fi

          echo ""
          echo "Currently ignored files:"

          if [ -s .sync-state/ignored-files.txt ]; then
            cat .sync-state/ignored-files.txt
          else
            echo "(none)"
          fi


      # ============================================================
      # 7. Build rclone filter file
      # ============================================================
      - name: Build Filters
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/rclone"

          python3 scripts/bisync-helper.py \
            build-filter \
            .sync-state/ignored-files.txt \
            "$HOME/.cache/rclone/bisync-filters.txt"


      # ============================================================
      # 8. Run bisync
      # ============================================================
      - name: Run Bisync
        id: bisync
        shell: bash
        run: |
          set +e

          SYNC_REMAINING=$((BISYNC_DEADLINE - $(date +%s)))
          LOG_FILE="$GITHUB_WORKSPACE/bisync.log"

          BACKUP_DIR2="koofr:/GoogleBackup-Trash/$(date -u +%Y-%m-%d_%H%M%S)"

          RESYNC_RUN=false

          COMMON_ARGS=(
            "--fast-list"
            "--drive-acknowledge-abuse"
            "--max-delete"
            "25"
            "--backup-dir2"
            "$BACKUP_DIR2"
            "--recover"
            "--resilient"
            "--tpslimit"
            "5"
            "--tpslimit-burst"
            "5"
            "--max-lock"
            "2m"
            "--checksum"
            "--transfers"
            "8"
            "--checkers"
            "16"
            "--filters-file"
            "$HOME/.cache/rclone/bisync-filters.txt"
            "--stats"
            "30s"
            "--stats-one-line"
            "--log-level"
            "INFO"
          )

          if [ "${{ inputs.resync }}" = "true" ]; then

            RESYNC_RUN=true
            echo "[MODE] MANUAL RESYNC"

            timeout --signal=INT --kill-after=120s "${SYNC_REMAINING}s" rclone bisync \
              gdrive:/ \
              koofr:/GoogleBackup \
              --resync \
              "${COMMON_ARGS[@]}" \
              2>&1 | tee "$LOG_FILE"

          elif [ "${{ steps.state.outputs.state_exists }}" = "true" ]; then

            echo "[MODE] NORMAL BISYNC"

            timeout --signal=INT --kill-after=120s "${SYNC_REMAINING}s" rclone bisync \
              gdrive:/ \
              koofr:/GoogleBackup \
              --track-renames \
              "${COMMON_ARGS[@]}" \
              2>&1 | tee "$LOG_FILE"

          else

            RESYNC_RUN=true
            echo "[MODE] INITIAL RESYNC"

            timeout --signal=INT --kill-after=120s "${SYNC_REMAINING}s" rclone bisync \
              gdrive:/ \
              koofr:/GoogleBackup \
              --resync \
              "${COMMON_ARGS[@]}" \
              2>&1 | tee "$LOG_FILE"

          fi

          RC=${PIPESTATUS[0]}

          # A timed-out initial resync has not established a trusted baseline.
          # Continue it next day, comparing existing files with --checksum.
          if [ "$RC" = 124 ] && [ "$RESYNC_RUN" = true ]; then
            touch .sync-state/resync-pending
          elif [ "$RC" = 0 ]; then
            rm -f .sync-state/resync-pending
          else
            # Real errors must remain fatal, without scheduling an automatic resync.
            rm -f .sync-state/resync-pending
          fi

          echo "rclone_exit_code=$RC" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Rclone exit code: $RC"

          exit 0


      # ============================================================
      # 9. Parse errors
      # ============================================================
      - name: Parse Bisync Errors
        id: parse_errors
        if: always() && hashFiles('bisync.log') != ''
        run: |
          python3 scripts/bisync-helper.py \
            parse \
            bisync.log \
            .sync-state/ignored-files.txt \
            .sync-state/ignored-report.txt \
            .sync-state/parse-result


      # ============================================================
      # 10. Rebuild filters if new ignored files were found
      # ============================================================
      - name: Rebuild Filters
        if: |
          steps.parse_errors.outputs.new_ignored != '0'
        run: |
          python3 scripts/bisync-helper.py \
            build-filter \
            .sync-state/ignored-files.txt \
            "$HOME/.cache/rclone/bisync-filters.txt"


      # ============================================================
      # 11. Retry ONLY when every detected error is ignorable
      # ============================================================
      - name: Retry With Ignored Files
        id: retry
        if: |
          steps.bisync.outputs.rclone_exit_code != '0'
          && steps.parse_errors.outputs.new_ignored != '0'
          && steps.parse_errors.outputs.has_unignorable_errors == 'false'
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "RETRY WITH IGNORED FILES"
          echo "============================================================"

          echo "Ignored files:"
          cat .sync-state/ignored-files.txt

          echo ""

          SYNC_REMAINING=$((BISYNC_DEADLINE - $(date +%s)))
          if [ "$SYNC_REMAINING" -lt 120 ]; then
            echo "Not enough time for retry; ignored files will be retained for the next run."
            echo "retry_exit_code=124" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Previous bisync was aborted.
          # Rebuild baseline using the updated filter.
          rm -rf "$HOME/.cache/rclone/bisync"

          RETRY_LOG="$GITHUB_WORKSPACE/bisync-retry.log"

          RETRY_BACKUP_DIR2="koofr:/GoogleBackup-Trash/$(date -u +%Y-%m-%d_%H%M%S)-retry"

          timeout --signal=INT --kill-after=120s "${SYNC_REMAINING}s" rclone bisync \
            gdrive:/ \
            koofr:/GoogleBackup \
            --resync \
            --fast-list \
            --drive-acknowledge-abuse \
            --max-delete 25 \
            --backup-dir2 "$RETRY_BACKUP_DIR2" \
            --recover \
            --resilient \
            --tpslimit 5 \
            --tpslimit-burst 5 \
            --max-lock 2m \
            --checksum \
            --transfers 8 \
            --checkers 16 \
            --filters-file "$HOME/.cache/rclone/bisync-filters.txt" \
            --stats 30s \
            --stats-one-line \
            --log-level INFO \
            2>&1 | tee "$RETRY_LOG"

          RC=${PIPESTATUS[0]}

          if [ "$RC" = 124 ]; then
            touch .sync-state/resync-pending
          else
            rm -f .sync-state/resync-pending
          fi

          echo "retry_exit_code=$RC" >> "$GITHUB_OUTPUT"

          exit 0


      # ============================================================
      # 12. Parse retry errors
      # ============================================================
      - name: Parse Retry Errors
        id: parse_retry
        if: |
          steps.retry.outputs.retry_exit_code != ''
          && steps.retry.outputs.retry_exit_code != '0'
        run: |
          python3 scripts/bisync-helper.py \
            parse-retry \
            bisync-retry.log \
            .sync-state/ignored-files.txt \
            .sync-state/retry-new-count


      # ============================================================
      # 13. Save bisync state
      # ============================================================
      - name: Check Bisync State To Save
        id: state_to_save
        if: always() && steps.state.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          STATE_DIR="$HOME/.cache/rclone/bisync"
          if [ -d "$STATE_DIR" ] && \
             [ -n "$(find "$STATE_DIR" -type f -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Bisync state found; saving for the next run."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No bisync state files to save."
          fi

      - name: Save Bisync State
        if: always() && steps.state_to_save.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/rclone/bisync
          key: rclone-bisync-state-${{ github.ref_name }}-${{ github.run_id }}


      # ============================================================
      # 14. Save ignored files
      # ============================================================
      - name: Save Ignored Files
        if: always() && steps.state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .sync-state
          key: rclone-ignored-files-${{ github.ref_name }}-${{ github.run_id }}


      # ============================================================
      # 15. Upload report
      # ============================================================
      - name: Upload Bisync Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bisync-report-${{ github.run_id }}
          path: |
            .sync-state/ignored-files.txt
            .sync-state/ignored-report.txt
            bisync.log
            bisync-retry.log
          if-no-files-found: ignore
          retention-days: 30


      # ============================================================
      # 16. GitHub Actions Summary
      # ============================================================
      - name: Generate Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Google Drive ↔ Koofr"
            echo ""
            echo "**Target:** \`koofr:/GoogleBackup\`"
            echo ""
            echo "### Ignored files"

            if [ -s .sync-state/ignored-files.txt ]; then
              COUNT=$(wc -l < .sync-state/ignored-files.txt)

              echo ""
              echo "**$COUNT file(s)** currently ignored."
              echo ""
              echo '```text'
              cat .sync-state/ignored-files.txt
              echo '```'
            else
              echo ""
              echo "No ignored files."
            fi

            echo ""
            echo "### Safety"
            echo ""
            echo "- Two-way bisync"
            echo "- --max-delete 25%"
            echo "- --backup-dir2 (file bị xóa ở Koofr được chuyển vào koofr:/GoogleBackup-Trash/, không xóa vĩnh viễn)"
            echo "- --recover"
            echo "- --resilient"
            echo "- --checksum (so sánh nội dung, không dùng modtime vì Koofr ghi sai)"
            echo "- Permission/FileBlocked errors are tracked"
            echo "- Other errors remain fatal"
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 17. Final status
      # ============================================================
      - name: Final Status
        shell: bash
        run: |
          set -euo pipefail

          RC="${{ steps.bisync.outputs.rclone_exit_code }}"
          RETRY_RC="${{ steps.retry.outputs.retry_exit_code }}"

          RETRY_NEW=$(cat .sync-state/retry-new-count 2>/dev/null || echo 0)

          echo "============================================================"
          echo "FINAL STATUS"
          echo "============================================================"

          echo "Initial rclone exit code: ${RC:-unknown}"
          echo "Retry rclone exit code:   ${RETRY_RC:-not-run}"
          echo "New errors during retry:  $RETRY_NEW"
          echo ""

          if [ "${RC:-1}" = "0" ]; then
            echo "BISYNC SUCCESS"
            exit 0
          fi

          # Exit 124 is our intentional 5-hour sync budget, not a data error.
          # For an unfinished resync, resync-pending was saved above so the
          # next scheduled run continues rebuilding the baseline.
          if [ "${RC:-1}" = "124" ]; then
            echo "::warning::5-hour sync budget reached. State/report were saved; the next scheduled run will continue."
            echo "BISYNC PAUSED AT 5-HOUR BUDGET"
            exit 0
          fi

          if [ "${RETRY_RC:-1}" = "0" ]; then

            if [ "$RETRY_NEW" != "0" ]; then
              echo "::warning::Retry succeeded but detected $RETRY_NEW new ignored file(s). Check the artifact."
            fi

            echo "BISYNC SUCCESS AFTER IGNORING PROBLEMATIC FILES"
            exit 0
          fi

          echo "BISYNC FAILED"
          echo ""
          echo "No unsafe automatic resync was performed."
          exit 1