name: Google Drive to Koofr Backup
on:
  schedule:
    - cron: '0 19 * * *' # 02:00 Vietnam, unchanged
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử chỉ đọc; không sao chép dữ liệu hoặc phát báo cáo backup.'
        required: false
        type: boolean
        default: true

concurrency:
  group: gdrive-koofr-bisync
  cancel-in-progress: false
permissions:
  contents: read

env:
  RCLONE_TPSLIMIT: '2'
  RCLONE_TPSLIMIT_BURST: '1'
  RCLONE_DRIVE_PACER_MIN_SLEEP: 500ms
  RCLONE_DRIVE_PACER_BURST: '1'

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-drive-copy
        with:
          rclone-config: ${{ secrets.RCLONE_CONFIG_CONTENT }}
      - name: Preview one-way backup
        run: python3 scripts/drive_copy.py --dry-run
      - name: Require completed preview
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('copy-result.json'))
          assert d['complete'] and d['dry_run'], 'Preview incomplete; no live copy allowed.'
          PY
      - name: Upload sanitized preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-copy-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: copy-result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove private probe files
        if: always()
        run: rm -rf .copy-state/private "$HOME/.config/rclone/rclone.conf" "$RUNNER_TEMP/copy-filter.log"

  run-copy:
    needs: preview
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-drive-copy
        with:
          rclone-config: ${{ secrets.RCLONE_CONFIG_CONTENT }}
      - name: Copy Drive to Koofr
        id: copy
        run: python3 scripts/drive_copy.py
      - name: Parse copy errors without exposing paths
        id: errors
        if: always() && steps.copy.outcome == 'success'
        run: |
          python3 scripts/bisync-helper.py parse .copy-state/private/copy.log .copy-state/ignored-files.txt .copy-state/private/ignored-report.txt .copy-state/private/parse-result > "$RUNNER_TEMP/copy-errors.log"
          cp .copy-state/ignored-files.txt .copy-ignore/ignored-files.txt
      - name: Save ignore list only
        if: always() && steps.errors.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .copy-ignore
          key: rclone-copy-ignore-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare terminal aggregate
        if: always() && steps.copy.outcome == 'success'
        env:
          RCLONE_RC: ${{ steps.copy.outputs.exit_code }}
          RETRY_RC: ''
          NEW_IGNORED: ${{ steps.errors.outputs.new_ignored }}
        run: python3 scripts/backup-summary.py
      - name: Publish report independently of copy outcome
        if: always() && steps.copy.outcome == 'success'
        env:
          REPORT_GAS_URL: ${{ vars.REPORT_GAS_URL }}
          REPORT_GAS_KEY: ${{ secrets.REPORT_GAS_KEY }}
        run: python3 scripts/publish_gas_report.py backup-summary.json
      - name: Upload sanitized terminal aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-copy-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            copy-result.json
            backup-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Require completed copy
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('copy-result.json'))
          assert d['complete'] and not d['dry_run'], 'Copy incomplete; see sanitized report.'
          PY
      - name: Remove private logs and credentials
        if: always()
        run: rm -rf .copy-state/private "$HOME/.config/rclone/rclone.conf" "$RUNNER_TEMP/copy-filter.log" "$RUNNER_TEMP/copy-errors.log"
