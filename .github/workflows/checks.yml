name: Backup safety checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned rclone for native local-fixture tests
        run: |
          set -euo pipefail
          curl -fsS --max-time 90 -o "$RUNNER_TEMP/rclone.zip" https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone-bin"
          echo "$RUNNER_TEMP/rclone-bin/rclone-v1.75.2-linux-amd64" >> "$GITHUB_PATH"
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
