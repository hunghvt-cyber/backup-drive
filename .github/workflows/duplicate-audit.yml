name: Diagnose Drive API access (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gdrive-koofr-bisync
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure credentials privately
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone audit encrypted
          printf '%s' "$RCLONE_CONFIG_CONTENT" | base64 --decode > ~/.config/rclone/rclone.conf
      - name: Diagnose Drive API authorization without modifying files
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rclone lsd gdrive:/ --max-depth 1 --log-file audit/drive.log > audit/root-folders.txt
          rclone cat koofr:/CloudDedupe-Quarantine/39808454335/cleanup-journal.json --log-file audit/koofr.log > audit/previous-journal.json
          python3 - <<'PY'
          import configparser,json,pathlib,urllib.request,urllib.error
          c=configparser.ConfigParser(interpolation=None)
          c.read(pathlib.Path.home()/'.config/rclone/rclone.conf')
          t=json.loads(c['gdrive']['token'])
          target=json.loads(pathlib.Path('audit/previous-journal.json').read_text())['entries'][0]['target']['ID']
          results=[]
          for label,url in [
              ('target_minimal','https://www.googleapis.com/drive/v3/files/'+target+'?fields=id&supportsAllDrives=true'),
              ('target_metadata','https://www.googleapis.com/drive/v3/files/'+target+'?fields=id,name,size,md5Checksum,sha256Checksum,trashed,parents,shared,ownedByMe,capabilities(canTrash),createdTime&supportsAllDrives=true'),
              ('list','https://www.googleapis.com/drive/v3/files?pageSize=1&fields=files(id)'),
              ('root_metadata','https://www.googleapis.com/drive/v3/files/root?fields=id,name,size,md5Checksum,sha256Checksum,trashed,parents,shared,ownedByMe,capabilities(canTrash),createdTime&supportsAllDrives=true')]:
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+t['access_token']})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
                  results.append({'test':label,'status':200})
              except urllib.error.HTTPError as e:
                  body=e.read().decode()
                  pathlib.Path('audit/'+label+'-error.json').write_text(body)
                  data=json.loads(body)
                  results.append({'test':label,'status':e.code,'reason':data.get('error',{}).get('errors',[{}])[0].get('reason'),'message':data.get('error',{}).get('message') if label.startswith('root') or label=='list' else 'details encrypted'})
          pathlib.Path('encrypted/summary.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results))
          PY
      - name: Encrypt private restoration journal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p audit encrypted
          cat > audit-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAt8vFR2TO5Gtjfyvj2Qxm
          MTr4wP/p2VeBEB1o3hWdkKvDoLvAN+dDvTQC7NqkJKJzA/BCP2Rr5UByqLFMWIcx
          nraLOSiiQvtFxFahK7N+w7Gsopru+VLMh2YCW2CsRx6t4u6qNowuh5QbfYV9uQd/
          urT6ho8FADYCH5YD+b5P+QPQKya8VDYW9WhP5X8m27nXwCrx20XTy+GqB/kHKsS1
          aYxKJoJU9LX5D/AE4/0+yzTCszDoEkuD3M+p41dQc2yM+RfLCW97Y8+Ad3QmAX8D
          0EYPExyfRrUtl7kH40sRqx2ZbnSNp1zWbL+b/Nrvv85AKxaRij5/ux0SpNoI8Sou
          uVprzTSiWEfU4oR8/OQayOwoQqsJB2M5/W931rWEpwNyV1NyO1iIHQopqesX9VZe
          3EYx/lrcuMLBO6yuaECVhoCcuq3aSFOoTlnYPabWZfBg9dxKA+UYVllMz1ucJkc6
          u97EccC5qohN7TeAW1tAX4ZAVhHxYz30eG8jMxnWIRYLAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          tar -czf inventory.tar.gz audit
          openssl rand -hex 32 > session-key
          openssl enc -aes-256-cbc -salt -pbkdf2 -in inventory.tar.gz -out encrypted/inventory.enc -pass file:session-key
          openssl pkeyutl -encrypt -pubin -inkey audit-public.pem -in session-key -out encrypted/session-key.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Upload encrypted journal only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-cleanup-${{ github.run_id }}
          path: encrypted/
          retention-days: 7
