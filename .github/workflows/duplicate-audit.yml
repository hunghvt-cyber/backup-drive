name: Verify duplicate cleanup (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gdrive-koofr-bisync
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure credentials privately
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone audit encrypted
          printf '%s' "$RCLONE_CONFIG_CONTENT" | base64 --decode > ~/.config/rclone/rclone.conf
      - name: Read-only post-cleanup and sharing verification
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > verify.py <<'PY'
          import collections, configparser, json, os, pathlib, subprocess, time, unicodedata, urllib.request, urllib.parse, urllib.error
          base=pathlib.Path('audit');base.mkdir(exist_ok=True)
          def rc(*args):
              p=subprocess.run(['rclone',*args],capture_output=True,text=True,timeout=180)
              if p.returncode:
                  with open(base/'rclone.log','a') as out:out.write(p.stderr)
                  raise RuntimeError('rclone read failed')
              return p.stdout
          rc('lsd','gdrive:/','--max-depth','1','--log-file',str(base/'rclone.log'))
          c=configparser.ConfigParser(interpolation=None);c.read(pathlib.Path.home()/'.config/rclone/rclone.conf')
          token=json.loads(c['gdrive']['token'])['access_token']
          j=json.loads(rc('cat','koofr:/CloudDedupe-Quarantine/39811260319/cleanup-journal.json','--log-file',str(base/'rclone.log')))
          json.dump(j,open(base/'previous-journal.json','w'),ensure_ascii=False)
          def request(path,params):
              url='https://www.googleapis.com/drive/v3/'+path+'?'+urllib.parse.urlencode(params)
              for attempt in range(6):
                  time.sleep(1)
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+token}),timeout=40) as res:return json.load(res)
                  except urllib.error.HTTPError as e:
                      body=e.read().decode()
                      with open(base/'api-errors.jsonl','a') as out:out.write(json.dumps({'status':e.code,'body':body})+'\n')
                      try:reason=json.loads(body).get('error',{}).get('errors',[{}])[0].get('reason','')
                      except Exception:reason=''
                      if attempt<5 and (e.code in (429,500,502,503,504) or reason in ('rateLimitExceeded','userRateLimitExceeded')):
                          time.sleep(min(2**(attempt+1),32));continue
                      raise RuntimeError('Google API HTTP '+str(e.code)+' '+reason) from None
          def meta(fid):return request('files/'+urllib.parse.quote(fid,safe=''),{'fields':'id,name,size,md5Checksum,sha256Checksum,trashed,parents,shared,ownedByMe,capabilities(canTrash)','supportsAllDrives':'true'})
          def h(f):return f.get('Hashes',{}).get('md5') or f.get('Hashes',{}).get('MD5')
          def matches(m,f):return not m.get('trashed') and int(m.get('size',-1))==f['Size'] and m.get('md5Checksum')==h(f) and (not f.get('Hashes',{}).get('sha256') or f['Hashes']['sha256']==m.get('sha256Checksum'))
          parents={}
          def children(pid):
              if pid not in parents:
                  values=[];page=None
                  while True:
                      p={'q':"'"+pid+"' in parents and trashed = false",'fields':'nextPageToken,files(id,name,size,md5Checksum)','pageSize':1000,'supportsAllDrives':'true','includeItemsFromAllDrives':'true'}
                      if page:p['pageToken']=page
                      r=request('files',p);values+=r.get('files',[]);page=r.get('nextPageToken')
                      if not page:break
                  parents[pid]=values
              return parents[pid]
          result={'entries':[],'source_run':39811260319}
          for e in j['entries']:
              r={'previous_status':e['status'],'target':e['target'],'keeper':e['keeper']}
              try:
                  tm=meta(e['target']['ID']);km=meta(e['keeper']['ID']);r.update(target_metadata=tm,keeper_metadata=km)
                  if e.get('verified'):
                      candidates=[]
                      for pid in km.get('parents',[]):
                          candidates.extend(f for f in children(pid) if unicodedata.normalize('NFC',f['name'])==unicodedata.normalize('NFC',km['name']))
                      k=json.loads(rc('lsjson','koofr:/GoogleBackup/'+e['keeper']['Path'],'--stat','--hash','--log-file',str(base/'rclone.log')))
                      r['active_normalized_name_matches']=len(candidates)
                      r['pass']=bool(tm.get('trashed') and matches(km,e['keeper']) and len(candidates)==1 and k['Size']==e['keeper']['Size'] and h(k)==h(e['keeper']))
                  else:
                      r['protection']={'owned':tm.get('ownedByMe'),'shared':tm.get('shared'),'can_trash':tm.get('capabilities',{}).get('canTrash')}
              except Exception as exc:r['error']=str(exc) if isinstance(exc,RuntimeError) else type(exc).__name__
              result['entries'].append(r)
          json.dump(result,open(base/'verification.json','w'),ensure_ascii=False,indent=2)
          summary={'previously_cleaned':sum(e.get('verified',False) for e in j['entries']),'postchecks_pass':sum(e.get('pass',False) for e in result['entries']),'postchecks_fail':sum(e['previous_status']=='drive_cleaned' and not e.get('pass',False) for e in result['entries']),'protected':dict(collections.Counter(json.dumps(e.get('protection'),sort_keys=True) for e in result['entries'] if e.get('protection'))),'errors':dict(collections.Counter(e['error'] for e in result['entries'] if e.get('error')))}
          pathlib.Path('encrypted').mkdir(exist_ok=True);json.dump(summary,open('encrypted/summary.json','w'),indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('Post-cleanup verification, read-only\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          print(json.dumps(summary))
          if summary['postchecks_fail'] or summary['errors']:raise SystemExit(2)
          PY
          python3 verify.py
      - name: Encrypt private restoration journal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p audit encrypted
          cat > audit-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAt8vFR2TO5Gtjfyvj2Qxm
          MTr4wP/p2VeBEB1o3hWdkKvDoLvAN+dDvTQC7NqkJKJzA/BCP2Rr5UByqLFMWIcx
          nraLOSiiQvtFxFahK7N+w7Gsopru+VLMh2YCW2CsRx6t4u6qNowuh5QbfYV9uQd/
          urT6ho8FADYCH5YD+b5P+QPQKya8VDYW9WhP5X8m27nXwCrx20XTy+GqB/kHKsS1
          aYxKJoJU9LX5D/AE4/0+yzTCszDoEkuD3M+p41dQc2yM+RfLCW97Y8+Ad3QmAX8D
          0EYPExyfRrUtl7kH40sRqx2ZbnSNp1zWbL+b/Nrvv85AKxaRij5/ux0SpNoI8Sou
          uVprzTSiWEfU4oR8/OQayOwoQqsJB2M5/W931rWEpwNyV1NyO1iIHQopqesX9VZe
          3EYx/lrcuMLBO6yuaECVhoCcuq3aSFOoTlnYPabWZfBg9dxKA+UYVllMz1ucJkc6
          u97EccC5qohN7TeAW1tAX4ZAVhHxYz30eG8jMxnWIRYLAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          tar -czf inventory.tar.gz audit
          openssl rand -hex 32 > session-key
          openssl enc -aes-256-cbc -salt -pbkdf2 -in inventory.tar.gz -out encrypted/inventory.enc -pass file:session-key
          openssl pkeyutl -encrypt -pubin -inkey audit-public.pem -in session-key -out encrypted/session-key.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Upload encrypted journal only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-cleanup-${{ github.run_id }}
          path: encrypted/
          retention-days: 7
