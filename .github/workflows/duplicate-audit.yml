          """One-time, allow-listed cleanup; private paths only in encrypted journal."""
          import collections, configparser, hashlib, json, os, pathlib, subprocess, sys, time, urllib.parse, urllib.request
          
          BASE = pathlib.Path('audit')
          BASE.mkdir(exist_ok=True)
          JOURNAL = BASE / 'cleanup-journal.json'
          plan = json.load(open('plan.json'))
          salt = plan['salt']
          def md5(f): return (f.get('Hashes') or {}).get('md5') or (f.get('Hashes') or {}).get('MD5')
          def fingerprint(f):
              return hashlib.sha256((salt+'\0'+json.dumps([f['ID'],f['Path'],f['Size'],md5(f)],ensure_ascii=False,separators=(',',':'))).encode()).hexdigest()
          def rclone(*args):
              p = subprocess.run(['rclone',*args],capture_output=True,text=True,timeout=240)
              if p.returncode:
                  with open(BASE/'operations.log','a') as log: log.write(p.stderr)
                  raise RuntimeError('rclone operation failed')
              return p.stdout
          files = json.loads(rclone('lsjson','gdrive:/','--recursive','--files-only','--hash','--log-file',str(BASE/'drive.log')))
          json.dump(files,open(BASE/'before-drive.json','w'),ensure_ascii=False)
          indexed = {fingerprint(f):f for f in files}
          config = configparser.ConfigParser(interpolation=None)
          config.read(pathlib.Path.home()/'.config/rclone/rclone.conf')
          token = json.loads(config['gdrive']['token'])['access_token']
          FIELDS = 'id,name,size,md5Checksum,sha256Checksum,trashed,parents,shared,ownedByMe,capabilities(canTrash),createdTime'
          def api(fid,body=None):
              url='https://www.googleapis.com/drive/v3/files/'+urllib.parse.quote(fid,safe='')+'?'+urllib.parse.urlencode({'supportsAllDrives':'true','fields':FIELDS})
              req=urllib.request.Request(url,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='PATCH' if body is not None else 'GET')
              with urllib.request.urlopen(req,timeout=45) as res:return json.load(res)
          def matches(meta,f):
              return not meta.get('trashed') and int(meta.get('size',-1))==f['Size'] and meta.get('md5Checksum')==md5(f) and (not f.get('Hashes',{}).get('sha256') or meta.get('sha256Checksum')==f['Hashes']['sha256'])
          def stat(path):
              f=json.loads(rclone('lsjson','koofr:/GoogleBackup/'+path,'--stat','--hash','--log-file',str(BASE/'koofr.log')))
              if not isinstance(f,dict):raise RuntimeError('invalid stat')
              return f
          def same(a,b):return a['Size']==b['Size'] and md5(a) and md5(a)==md5(b)
          journal={'source_inventory_run':plan['source_inventory_run'],'run_id':os.environ.get('GITHUB_RUN_ID'),'entries':[]}
          def save():
              tmp=JOURNAL.with_suffix('.tmp');tmp.write_text(json.dumps(journal,ensure_ascii=False,indent=2));tmp.replace(JOURNAL)
          save()
          for entry in plan['entries']:
              record={'entry':entry,'status':'pending'};journal['entries'].append(record);save()
              try:
                  target=indexed.get(entry['remove']); keeper=indexed.get(entry['keep'])
                  if not target or not keeper:raise RuntimeError('planned identity changed or missing')
                  if target['Path'].startswith('Tapo-Archive/') or keeper['Path'].startswith('Tapo-Archive/'):raise RuntimeError('protected archive')
                  if target['ID']==keeper['ID'] or not same(target,keeper):raise RuntimeError('invalid pair')
                  record.update(target=target,keeper=keeper)
                  tm,km=api(target['ID']),api(keeper['ID'])
                  if not matches(tm,target) or not matches(km,keeper):raise RuntimeError('Drive content changed')
                  if not tm.get('ownedByMe') or tm.get('shared') or not tm.get('capabilities',{}).get('canTrash'):raise RuntimeError('target shared, not owned, or cannot trash')
                  if sorted(tm.get('parents',[]))!=sorted(km.get('parents',[])):raise RuntimeError('different actual parent folders')
                  if entry['kind']=='unicode':
                      k=stat(keeper['Path'])
                      if not same(k,keeper):raise RuntimeError('Koofr retained counterpart differs')
                  elif entry['kind']=='conflict_suffix':
                      ktarget,kkeep=stat(target['Path']),stat(keeper['Path'])
                      if not same(ktarget,target) or not same(kkeep,keeper):raise RuntimeError('Koofr pair changed')
                      record['quarantine']='koofr:/CloudDedupe-Quarantine/'+os.environ['GITHUB_RUN_ID']+'/'+target['Path']
                  else:raise RuntimeError('unknown plan kind')
                  record['status']='validated';save()
                  # Persist exact restoration identities outside the bisync root before mutation.
                  rclone('copyto',str(JOURNAL),'koofr:/CloudDedupe-Quarantine/'+os.environ['GITHUB_RUN_ID']+'/cleanup-journal.json','--log-file',str(BASE/'koofr.log'))
                  if not matches(api(keeper['ID']),keeper):raise RuntimeError('keeper changed before mutation')
                  record['status']='trash_requested';save()
                  response=api(target['ID'],{'trashed':True})
                  if not response.get('trashed'):raise RuntimeError('trash not confirmed')
                  record['status']='drive_trashed';save()
                  if entry['kind']=='conflict_suffix':
                      try:
                          rclone('moveto','koofr:/GoogleBackup/'+target['Path'],record['quarantine'],'--immutable','--log-file',str(BASE/'koofr.log'))
                          dest=json.loads(rclone('lsjson',record['quarantine'],'--stat','--hash','--log-file',str(BASE/'koofr.log')))
                          if not same(dest,target):raise RuntimeError('quarantine content mismatch')
                          record['status']='both_sides_cleaned';save()
                      except Exception:
                          api(target['ID'],{'trashed':False});record['status']='drive_restored_after_koofr_error';save();raise
                  else:record['status']='drive_cleaned';save()
                  if not api(target['ID']).get('trashed') or not matches(api(keeper['ID']),keeper):raise RuntimeError('post-check failed')
                  record['verified']=True;save()
              except Exception as exc:
                  record['error']=str(exc) if isinstance(exc,RuntimeError) else type(exc).__name__
                  if record['status'] in ('pending','validated'):record['status']='skipped'
                  save()
              time.sleep(.15)
          rclone('copyto',str(JOURNAL),'koofr:/CloudDedupe-Quarantine/'+os.environ['GITHUB_RUN_ID']+'/cleanup-journal.json','--log-file',str(BASE/'koofr.log'))
          counts=collections.Counter(e['status'] for e in journal['entries'])
          summary={'planned':len(plan['entries']),'statuses':dict(counts),'verified':sum(bool(e.get('verified')) for e in journal['entries']),'drive_trashed_bytes':sum(e['target']['Size'] for e in journal['entries'] if e.get('verified')),'koofr_quarantined_bytes':sum(e['target']['Size'] for e in journal['entries'] if e.get('verified') and e['entry']['kind']=='conflict_suffix'),'skipped_reasons':dict(collections.Counter(e.get('error') for e in journal['entries'] if e.get('error')))}
          pathlib.Path('encrypted').mkdir(exist_ok=True)
          json.dump(summary,open('encrypted/summary.json','w'),indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('Recoverable allow-listed cleanup; Tapo protected.\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          print(json.dumps(summary))
          PY
          python3 cleanup.py
