name: Read-only duplicate audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_CONTENT" | base64 --decode > ~/.config/rclone/rclone.conf
      - name: Inventory read-only
        run: |
          set -euo pipefail
          mkdir -p audit
          timeout 3000 rclone lsjson gdrive:/ --recursive --files-only --hash > audit/drive.json
          timeout 3000 rclone lsjson koofr:/GoogleBackup --recursive --files-only --hash > audit/koofr.json
          timeout 3000 rclone lsjson koofr:/GoogleBackup-Trash --recursive --files-only --hash > audit/trash.json
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-audit
          path: audit/
          retention-days: 7
