name: Reclean 15 regenerated duplicates (recoverable)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gdrive-koofr-bisync
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure credentials privately
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/rclone audit encrypted
          printf '%s' "$RCLONE_CONFIG_CONTENT" | base64 --decode > ~/.config/rclone/rclone.conf
      - name: Revalidate fixed 15 IDs, trash duplicates, verify keepers
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > reclean-plan.json <<'JSON'
          {"salt": "4525ed22c226bd23c25ff74bffb73c7cd46a02b4e605b912a377e56bc3169d1b", "targets": ["d91fa07f0d4ebb4edf5dc7ca41c754cc28fda0e99e0ea84ddd009f99b88fcaef", "1caa3f2ad69d0a49b19287781e983f78b9557c4ba9be737bcc334ba29f9a9e41", "a6917bb05ec4d6ea84cb254e9f1df9bc2c73162d649d08a55e2f9afd38229627", "7bf7a08150cd788e9b5c947a51b4237de9fa22c136e51e9757336280abd6b260", "aacceddf27454c60eefebc101219cbf7fb275a2ef03ab1282d647a8e91f77507", "a369fdec1b003688d596c49e917476a01b83c0fceb0f4bacccc206e144fe22f6", "4816ae6698a3b3d9cf35f9939697c19f94390417828e27712362ba397ff14c75", "6446eb9094a8a044e3e732d16d27a2bf07862cafe975f89e1ae75389ef69aff6", "9984b2840d8845b987c3fdf9c90f0d6c269332a5dc389617fb83ab94bbbe549c", "0e60458227210146e319ae6ae75095a93b0dfa1817ccfb4ff494b0d89652d2bb", "c6d10a78fb96b79a70be14826774b0557162d417fd655b7e7dd02bb10a715c63", "8db282e7833e71b716434c93997bff49792181f6d6e1efc428b388bf17f9b439", "2b6cd6f75504e41fe86a4c2169aa8fb8a40dd60783ec0004c92dda75ed7e45d5", "a0f8be38b50c2e575acb106e7f3de06bc8fec9e33ae0dd79a5e613d2aa9d9bff", "39fcdf0b2bcb39c307242bef676fd5e6e1623ce55ad00435f959fd990114456b"]}
          JSON
          cat > reclean.py <<'PY'
          import collections, configparser, hashlib, json, os, pathlib, subprocess, time, unicodedata, urllib.request, urllib.parse, urllib.error
          base=pathlib.Path('audit');base.mkdir(exist_ok=True)
          plan=json.load(open('reclean-plan.json'))
          def rc(*args):
              p=subprocess.run(['rclone',*args],capture_output=True,text=True,timeout=180)
              if p.returncode:
                  with open(base/'rclone.log','a') as out:out.write(p.stderr)
                  raise RuntimeError('rclone operation failed')
              return p.stdout
          rc('lsd','gdrive:/','--max-depth','1','--log-file',str(base/'rclone.log'))
          c=configparser.ConfigParser(interpolation=None);c.read(pathlib.Path.home()/'.config/rclone/rclone.conf')
          token=json.loads(c['gdrive']['token'])['access_token']
          old=json.loads(rc('cat','koofr:/CloudDedupe-Quarantine/39811260319/cleanup-journal.json','--log-file',str(base/'rclone.log')))
          FIELDS='id,name,size,md5Checksum,sha256Checksum,trashed,parents,shared,ownedByMe,capabilities(canTrash),createdTime'
          def request(path,params,body=None):
              url='https://www.googleapis.com/drive/v3/'+path+'?'+urllib.parse.urlencode(params)
              for attempt in range(6):
                  time.sleep(1)
                  req=urllib.request.Request(url,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='PATCH' if body is not None else 'GET')
                  try:
                      with urllib.request.urlopen(req,timeout=40) as res:return json.load(res)
                  except urllib.error.HTTPError as e:
                      body_text=e.read().decode()
                      with open(base/'api-errors.jsonl','a') as out:out.write(json.dumps({'status':e.code,'body':body_text})+'\n')
                      try:reason=json.loads(body_text).get('error',{}).get('errors',[{}])[0].get('reason','')
                      except Exception:reason=''
                      if attempt<5 and (e.code in (429,500,502,503,504) or reason in ('rateLimitExceeded','userRateLimitExceeded')):
                          time.sleep(min(2**(attempt+1),32));continue
                      raise RuntimeError('Google API HTTP '+str(e.code)+' '+reason) from None
          def meta(fid):return request('files/'+urllib.parse.quote(fid,safe=''),{'fields':FIELDS,'supportsAllDrives':'true'})
          def trash(fid):return request('files/'+urllib.parse.quote(fid,safe=''),{'fields':FIELDS,'supportsAllDrives':'true'},{'trashed':True})
          def fp(m):
              values=[m['id'],m['name'],sorted(m.get('parents',[])),str(m['size']),m.get('md5Checksum'),m.get('sha256Checksum'),m.get('createdTime')]
              return hashlib.sha256((plan['salt']+'\0'+json.dumps(values,ensure_ascii=False,separators=(',',':'))).encode()).hexdigest()
          def md5(f):return f.get('Hashes',{}).get('md5') or f.get('Hashes',{}).get('MD5')
          def same(a,b):return int(a.get('size',-1))==int(b.get('size',-2)) and bool(a.get('md5Checksum')) and a.get('md5Checksum')==b.get('md5Checksum') and bool(a.get('sha256Checksum')) and a.get('sha256Checksum')==b.get('sha256Checksum')
          def keeper_ok(m,f):return not m.get('trashed') and int(m.get('size',-1))==f['Size'] and m.get('md5Checksum')==md5(f) and (not f.get('Hashes',{}).get('sha256') or m.get('sha256Checksum')==f['Hashes']['sha256'])
          def protected(m):return not m.get('ownedByMe') or m.get('shared') or not m.get('capabilities',{}).get('canTrash')
          def norm(s):return unicodedata.normalize('NFC',s)
          def children(pid):
              result=[];page=None
              while True:
                  params={'q':"'"+pid+"' in parents and trashed = false",'fields':'nextPageToken,files('+FIELDS+')','pageSize':1000,'supportsAllDrives':'true','includeItemsFromAllDrives':'true'}
                  if page:params['pageToken']=page
                  r=request('files',params);result+=r.get('files',[]);page=r.get('nextPageToken')
                  if not page:return result
          j={'source_verification':39898010755,'run_id':os.environ['GITHUB_RUN_ID'],'entries':[],'postchecks':[]}
          allowed=set(plan['targets']);seen=set();keepers=[]
          for e in old['entries']:
              if not e.get('verified'):continue
              f=e['keeper'];km=meta(f['ID'])
              if not keeper_ok(km,f) or len(km.get('parents',[]))!=1:raise RuntimeError('Keeper preflight changed')
              k=json.loads(rc('lsjson','koofr:/GoogleBackup/'+f['Path'],'--stat','--hash','--log-file',str(base/'rclone.log')))
              if k['Size']!=f['Size'] or md5(k)!=md5(f):raise RuntimeError('Koofr keeper changed')
              keepers.append({'file':f,'metadata':km,'koofr':k})
              for m in children(km['parents'][0]):
                  if m['id']==km['id'] or norm(m['name'])!=norm(km['name']):continue
                  key=fp(m)
                  if key not in allowed:continue
                  if protected(m) or not same(m,km) or m.get('parents')!=km.get('parents'):raise RuntimeError('Target preflight protection or content change')
                  if key in seen:raise RuntimeError('Repeated allow-list target')
                  seen.add(key);j['entries'].append({'target':m,'keeper':km,'status':'planned'})
          if seen!=allowed or len(j['entries'])!=15 or sum(int(e['target']['size']) for e in j['entries'])!=30217626:raise RuntimeError('Fixed allow-list no longer matches; no mutation')
          j['keepers']=keepers
          journal=base/'cleanup-journal.json'
          remote='koofr:/CloudDedupe-Quarantine/'+os.environ['GITHUB_RUN_ID']+'/cleanup-journal.json'
          def save(remote_copy=False):
              json.dump(j,open(journal,'w'),ensure_ascii=False,indent=2)
              if remote_copy:rc('copyto',str(journal),remote,'--log-file',str(base/'rclone.log'))
          save(True)
          try:
              for e in j['entries']:
                  t=meta(e['target']['id']);k=meta(e['keeper']['id'])
                  if fp(t)!=fp(e['target']) or t.get('trashed') or protected(t) or not same(t,k) or k.get('trashed') or k.get('parents')!=e['keeper'].get('parents') or t.get('parents')!=k.get('parents'):raise RuntimeError('Target or keeper changed before trash')
                  e['status']='trash_requested';save()
                  trash(t['id'])
                  tm=meta(t['id']);km=meta(k['id'])
                  if not tm.get('trashed') or km.get('trashed') or not same(km,e['keeper']):raise RuntimeError('Immediate trash postcheck failed')
                  e['status']='trashed_verified';save()
                  print('Verified trashed '+str(sum(x['status']=='trashed_verified' for x in j['entries']))+'/15',flush=True)
              for e in keepers:
                  f=e['file'];km=meta(f['ID']);live=[x for x in children(km['parents'][0]) if norm(x['name'])==norm(km['name'])]
                  passed=keeper_ok(km,f) and len(live)==1 and live[0]['id']==km['id']
                  j['postchecks'].append({'keeper_id':km['id'],'live_normalized_name_matches':len(live),'pass':passed})
          finally:save(True)
          summary={'allowlisted':15,'trashed_verified':sum(e['status']=='trashed_verified' for e in j['entries']),'trashed_bytes':sum(int(e['target']['size']) for e in j['entries'] if e['status']=='trashed_verified'),'keeper_groups_checked':len(j['postchecks']),'keeper_groups_clean':sum(e['pass'] for e in j['postchecks']),'shared_candidates_untouched':29,'koofr_files_moved':0}
          pathlib.Path('encrypted').mkdir(exist_ok=True);json.dump(summary,open('encrypted/summary.json','w'),indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('Recoverable cleanup after FolderSync setting change\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          print(json.dumps(summary))
          if summary['trashed_verified']!=15 or summary['keeper_groups_clean']!=16:raise SystemExit(2)
          PY
          python3 reclean.py
      - name: Encrypt private restoration journal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p audit encrypted
          cat > audit-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAt8vFR2TO5Gtjfyvj2Qxm
          MTr4wP/p2VeBEB1o3hWdkKvDoLvAN+dDvTQC7NqkJKJzA/BCP2Rr5UByqLFMWIcx
          nraLOSiiQvtFxFahK7N+w7Gsopru+VLMh2YCW2CsRx6t4u6qNowuh5QbfYV9uQd/
          urT6ho8FADYCH5YD+b5P+QPQKya8VDYW9WhP5X8m27nXwCrx20XTy+GqB/kHKsS1
          aYxKJoJU9LX5D/AE4/0+yzTCszDoEkuD3M+p41dQc2yM+RfLCW97Y8+Ad3QmAX8D
          0EYPExyfRrUtl7kH40sRqx2ZbnSNp1zWbL+b/Nrvv85AKxaRij5/ux0SpNoI8Sou
          uVprzTSiWEfU4oR8/OQayOwoQqsJB2M5/W931rWEpwNyV1NyO1iIHQopqesX9VZe
          3EYx/lrcuMLBO6yuaECVhoCcuq3aSFOoTlnYPabWZfBg9dxKA+UYVllMz1ucJkc6
          u97EccC5qohN7TeAW1tAX4ZAVhHxYz30eG8jMxnWIRYLAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          tar -czf inventory.tar.gz audit
          openssl rand -hex 32 > session-key
          openssl enc -aes-256-cbc -salt -pbkdf2 -in inventory.tar.gz -out encrypted/inventory.enc -pass file:session-key
          openssl pkeyutl -encrypt -pubin -inkey audit-public.pem -in session-key -out encrypted/session-key.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Upload encrypted journal only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-cleanup-${{ github.run_id }}
          path: encrypted/
          retention-days: 7
